<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="telemetryGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3b5c" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3"/>
    </pattern>

    <style>
      .bg-grid { fill: url(#telemetryGrid); }
      .ecg-line {
        stroke: #00f2fe;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.7));
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: ecgSweep 4s ease-in-out infinite;
      }
      .secondary-pulse {
        stroke: #ff3366;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        opacity: 0.75;
        filter: drop-shadow(0 0 5px rgba(255, 51, 102, 0.6));
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: pulseSweep 5s linear infinite;
      }
      .floating-node-1 {
        animation: float1 4s ease-in-out infinite alternate;
      }
      .floating-node-2 {
        animation: float2 5s ease-in-out infinite alternate;
      }
      .telemetry-radar {
        transform-origin: 1040px 180px;
        animation: radarSpin 12s linear infinite;
      }
      .glow-orbit {
        animation: pulseHalo 3s ease-in-out infinite alternate;
      }
      @keyframes ecgSweep {
        0% { stroke-dashoffset: 1400; opacity: 0.2; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -1400; opacity: 0.2; }
      }
      @keyframes pulseSweep {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes radarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseHalo {
        0% { r: 65; opacity: 0.2; }
        100% { r: 85; opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" class="bg-grid"/>

  <!-- Subtle Ambient Glow Rings in Background -->
  <circle cx="1040" cy="180" r="110" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="1040" cy="180" r="80" fill="none" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="1040" cy="180" class="glow-orbit" fill="#00f2fe" fill-opacity="0.04" stroke="#ff3366" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Rotating Telemetry Target / Radar Scanner (Right Side) -->
  <g class="telemetry-radar">
    <line x1="1040" y1="180" x2="1140" y2="180" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="1140" cy="180" r="4" fill="#00f2fe"/>
  </g>

  <!-- Simulated Smartwatch Silhouette & Core Biometric Graphic -->
  <g transform="translate(1040, 180)">
    <!-- Watch Case outline -->
    <rect x="-48" y="-56" width="96" height="112" rx="28" fill="#10192e" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Screen display area -->
    <rect x="-40" y="-48" width="80" height="96" rx="20" fill="#070c18"/>
    <!-- Watch Straps -->
    <path d="M -26 -56 L -26 -72 L 26 -72 L 26 -56 Z" fill="#1b2a4a" stroke="#2a3b5c" stroke-width="1"/>
    <path d="M -26 56 L -26 72 L 26 72 L 26 56 Z" fill="#1b2a4a" stroke="#2a3b5c" stroke-width="1"/>
    <!-- Digital Heart & Vitals Icon inside Watch -->
    <path d="M 0 5 C -1.5 2 -7 -4 -7 -9 C -7 -13.5 -3.5 -16 0 -13 C 3.5 -16 7 -13.5 7 -9 C 7 -4 1.5 2 0 5 Z" fill="#ff3366" filter="drop-shadow(0 0 4px #ff3366)"/>
    <!-- Mini Watch telemetry metric -->
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" text-anchor="middle">72 BPM</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#8892b0" text-anchor="middle">98% SpO2</text>
  </g>

  <!-- Dynamic Live Continuous ECG Waveforms across canvas (positioned behind text / bottom overlay) -->
  <path class="secondary-pulse" d="M 50 280 L 250 280 L 270 295 L 285 240 L 300 310 L 315 275 L 330 280 L 520 280 L 540 295 L 555 235 L 570 315 L 585 275 L 600 280 L 800 280 L 820 295 L 835 240 L 850 310 L 865 275 L 880 280 L 1150 280" />
  <path class="ecg-line" d="M 40 220 L 220 220 L 235 220 L 245 205 L 255 240 L 265 140 L 280 260 L 295 210 L 310 220 L 580 220 L 595 205 L 605 240 L 615 135 L 630 265 L 645 210 L 660 220 L 900 220 L 915 205 L 925 240 L 935 140 L 950 260 L 965 210 L 980 220 L 1160 220" />

  <!-- Background Floating Telemetry Indicator Badges -->
  <g class="floating-node-1" transform="translate(680, 50)">
    <rect width="180" height="38" rx="19" fill="#13233e" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#00f2fe"/>
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">BLE TELEMETRY</text>
    <text x="148" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f2fe">LIVE</text>
  </g>

  <g class="floating-node-2" transform="translate(880, 85)">
    <rect width="170" height="36" rx="18" fill="#1b1d36" stroke="#ff3366" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="18" cy="18" r="5" fill="#ff3366"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">HRV / R-R INTERVALS</text>
  </g>

  <!-- Foreground Title and Subtitle Content (High Contrast & Clear Hierarchy) -->
  <g transform="translate(65, 80)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, -10)">
      <rect width="250" height="28" rx="14" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="1.5">⚡ WEARABLE COMPUTING &amp; IOT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Wearable Computing
    </text>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#primaryGlow)" letter-spacing="-0.5">
      &amp; Health Telemetry Ecosystem
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated Open-Source Smartwatch Firmware, Biosensors, Health Vaults &amp; Telemetry Analytics
    </text>

    <!-- Telemetry Feature Pills -->
    <g transform="translate(0, 172)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="132" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">💓 ECG / PPG / HRV</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="144" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="156" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">⌚ Open Firmware</text>

      <!-- Pill 3 -->
      <rect x="296" y="0" width="148" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="310" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">🔒 Self-Hosted Vaults</text>

      <!-- Pill 4 -->
      <rect x="454" y="0" width="134" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="468" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">📊 FIT / GPX Parsers</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGlow)"/>
</svg>